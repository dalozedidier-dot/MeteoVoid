name: Belgium Alert Watch

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "auto, today, tomorrow, next-friday or YYYY-MM-DD"
        required: false
        default: "auto"
      min_severity:
        description: "Minimum severity for webhook notification"
        required: false
        default: "medium"
        type: choice
        options:
          - normal
          - watch
          - medium
          - high
          - alert
      offline_demo:
        description: "Use deterministic demo data instead of Open-Meteo"
        required: false
        default: false
        type: boolean
      irm_warning_level:
        description: "Manual IRM/KMI warning level if known"
        required: false
        default: "none"
        type: choice
        options: [none, yellow, orange, red]
      official_forecast_signal:
        description: "Official IRM/KMI forecast signal from the textual bulletin"
        required: false
        default: "none"
        type: choice
        options: [none, heat, instability, thunderstorms, severe_thunderstorms]
      heat_warning_active:
        description: "Official Belgian heat warning or heat phase active"
        required: false
        default: false
        type: boolean
      metealarm_level:
        description: "Manual MeteoAlarm level if known"
        required: false
        default: "none"
        type: choice
        options: [none, yellow, orange, red]
      estofex_level:
        description: "Manual ESTOFEX level if known"
        required: false
        default: "none"
        type: choice
        options: [none, level1, level2, level3]
      radar_confirmation:
        description: "Manual radar confirmation"
        required: false
        default: "none"
        type: choice
        options: [none, weak, moderate, strong]
      lightning_confirmation:
        description: "Manual lightning confirmation"
        required: false
        default: "none"
        type: choice
        options: [none, nearby, confirmed]
      external_note:
        description: "Optional external context note"
        required: false
        default: ""
      auto_external:
        description: "Fetch fail-safe IRM/KMI, MeteoAlarm and ESTOFEX confirmations"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: belgium-alert-watch
  cancel-in-progress: true

jobs:
  belgium-alert-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: "1"
      METEOVOID_ALERT_WEBHOOK_URL: ${{ secrets.METEOVOID_ALERT_WEBHOOK_URL }}
      METEOVOID_RADAR_JSON_URL: ${{ secrets.METEOVOID_RADAR_JSON_URL }}
      METEOVOID_LIGHTNING_JSON_URL: ${{ secrets.METEOVOID_LIGHTNING_JSON_URL }}
      METEOVOID_HISTORY_DIR: .meteovoid_history/belgium_alert

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore MeteoVoid history
        uses: actions/cache/restore@v5
        with:
          path: .meteovoid_history
          key: belgium-alert-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            belgium-alert-history-${{ github.ref_name }}-
            belgium-alert-history-

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[live,viz]"

      - name: Prepare Belgium geodata
        run: |
          set -euo pipefail
          mkdir -p _ci_out/belgium_alert
          OFFLINE_DEMO="${{ inputs.offline_demo || 'false' }}"
          cmd=(python tools/prepare_belgium_geodata.py --out-dir _ci_out/belgium_alert)
          if [ "$OFFLINE_DEMO" = "true" ]; then
            cmd+=(--offline)
          fi
          "${cmd[@]}"

      - name: Prepare output
        run: |
          set -euo pipefail
          mkdir -p _ci_out/belgium_alert "$METEOVOID_HISTORY_DIR"

      - name: Generate Belgium alert report
        run: |
          set -euo pipefail
          TARGET_DATE="${{ inputs.target_date || 'auto' }}"
          MIN_SEVERITY="${{ inputs.min_severity || 'medium' }}"
          OFFLINE_DEMO="${{ inputs.offline_demo || 'false' }}"
          IRM_WARNING_LEVEL="${{ inputs.irm_warning_level || 'none' }}"
          OFFICIAL_FORECAST_SIGNAL="${{ inputs.official_forecast_signal || 'none' }}"
          HEAT_WARNING_ACTIVE="${{ inputs.heat_warning_active || 'false' }}"
          METEOALARM_LEVEL="${{ inputs.meteoalarm_level || 'none' }}"
          ESTOFEX_LEVEL="${{ inputs.estofex_level || 'none' }}"
          RADAR_CONFIRMATION="${{ inputs.radar_confirmation || 'none' }}"
          LIGHTNING_CONFIRMATION="${{ inputs.lightning_confirmation || 'none' }}"
          EXTERNAL_NOTE="${{ inputs.external_note || '' }}"
          AUTO_EXTERNAL="${{ inputs.auto_external || 'true' }}"

          cmd=(
            python tools/generate_belgium_alert_report.py
            --stations config/stations_belgium.yaml
            --target-date "$TARGET_DATE"
            --out-dir _ci_out/belgium_alert
            --history-dir "$METEOVOID_HISTORY_DIR"
            --run-id "gha_${{ github.run_id }}_${{ github.run_attempt }}"
            --webhook-url "$METEOVOID_ALERT_WEBHOOK_URL"
            --min-severity "$MIN_SEVERITY"
            --irm-warning-level "$IRM_WARNING_LEVEL"
            --official-forecast-signal "$OFFICIAL_FORECAST_SIGNAL"
            --metealarm-level "$METEOALARM_LEVEL"
            --estofex-level "$ESTOFEX_LEVEL"
            --radar-confirmation "$RADAR_CONFIRMATION"
            --lightning-confirmation "$LIGHTNING_CONFIRMATION"
            --external-note "$EXTERNAL_NOTE"
            --external-sources-config config/external_sources_belgium.yaml
            --calibration-config config/belgium_scoring_calibration.yaml
            --province-geojson _ci_out/belgium_alert/belgium_boundaries_provinces.geojson
            --replay-events config/belgium_replay_events.example.csv
          )

          if [ -n "$METEOVOID_RADAR_JSON_URL" ]; then
            cmd+=(--radar-json-url "$METEOVOID_RADAR_JSON_URL")
          fi
          if [ -n "$METEOVOID_LIGHTNING_JSON_URL" ]; then
            cmd+=(--lightning-json-url "$METEOVOID_LIGHTNING_JSON_URL")
          fi
          if [ "$AUTO_EXTERNAL" = "true" ]; then
            cmd+=(--auto-external)
          fi
          if [ "$OFFLINE_DEMO" = "true" ]; then
            cmd+=(--offline-demo)
          fi
          if [ "$HEAT_WARNING_ACTIVE" = "true" ]; then
            cmd+=(--heat-warning-active)
          fi

          "${cmd[@]}"

      - name: Generate public 5-day bulletin and validation history
        if: always()
        run: |
          set -euo pipefail
          OFFLINE_DEMO="${{ inputs.offline_demo || 'false' }}"
          bulletin_cmd=(python tools/generate_belgium_5day_bulletin.py --out-dir _ci_out/belgium_alert --days 5)
          if [ "$OFFLINE_DEMO" = "true" ]; then
            bulletin_cmd+=(--offline-demo)
          fi
          "${bulletin_cmd[@]}"
          if [ -f _ci_out/belgium_alert/belgium_alert_report.json ]; then
            python tools/update_belgium_validation_history.py \
              --report _ci_out/belgium_alert/belgium_alert_report.json \
              --history-dir "$METEOVOID_HISTORY_DIR/validation" \
              --verified-events config/belgium_verified_storm_events.csv \
              --out-dir _ci_out/belgium_alert
          fi

      - name: Show Markdown summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f _ci_out/belgium_alert/belgium_alert_report.md ]; then
            cat _ci_out/belgium_alert/belgium_alert_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated files:" >> "$GITHUB_STEP_SUMMARY"
          find _ci_out/belgium_alert -maxdepth 1 -type f -printf "- %f\n" | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Save MeteoVoid history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .meteovoid_history
          key: belgium-alert-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Belgium alert artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: belgium_alert_report
          path: _ci_out/belgium_alert/
          if-no-files-found: error
