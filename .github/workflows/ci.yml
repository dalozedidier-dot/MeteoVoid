name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: constraints-ci.txt
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install (editable + dev/live/viz)
        run: python -m pip install -e ".[dev,live,viz]"

      - name: Lint (pre-commit)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: python -X faulthandler -m pytest -q
