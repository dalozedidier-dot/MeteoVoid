name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare output dir
        run: |
          mkdir -p _ci_out/live_smoke

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build

      - name: Up Redis
        run: |
          docker compose -f docker-compose.yml up -d redis
          docker compose -f docker-compose.yml ps

      - name: Up live + api
        run: |
          docker compose -f docker-compose.yml up -d meteovoid-live meteovoid-api
          docker compose -f docker-compose.yml ps

      - name: Wait /health (inside api container)
        run: |
          docker compose -f docker-compose.yml exec -T meteovoid-api python - <<'PY'
          import json, time
          from urllib.request import Request, urlopen

          url = "http://localhost:8000/health"
          t0 = time.time()
          last = None
          while True:
              try:
                  req = Request(url, headers={"Accept": "application/json"})
                  with urlopen(req, timeout=2.0) as r:
                      data = r.read().decode("utf-8", errors="replace")
                  obj = json.loads(data)
                  last = obj
                  if isinstance(obj, dict) and obj.get("status") == "ok":
                      print("health ok")
                      break
              except Exception as e:
                  last = {"error": str(e)}
              if time.time() - t0 > 90:
                  raise SystemExit(f"health timeout, last={last}")
              time.sleep(1.0)
          PY

      - name: Seed observations (simulate)
        run: |
          docker compose -f docker-compose.yml run --rm meteovoid-simulate

      - name: Wait /latest (inside api container) and save latest.json
        run: |
          docker compose -f docker-compose.yml exec -T meteovoid-api python - <<'PY' > _ci_out/live_smoke/latest.json
          import json, time
          from urllib.request import Request, urlopen

          url = "http://localhost:8000/latest"
          t0 = time.time()
          last = None
          while True:
              try:
                  req = Request(url, headers={"Accept":"application/json"})
                  with urlopen(req, timeout=2.0) as r:
                      data = r.read().decode("utf-8", errors="replace")
                  obj = json.loads(data)
                  last = obj
                  if isinstance(obj, dict) and obj.get("score") is not None and obj.get("state") is not None:
                      print(json.dumps(obj, indent=2, sort_keys=True))
                      break
              except Exception as e:
                  last = {"error": str(e)}
              if time.time() - t0 > 120:
                  raise SystemExit(f"latest timeout, last={last}")
              time.sleep(1.0)
          PY

      - name: Generate bulletin (md + json + history)
        run: |
          python tools/generate_bulletin.py             --api-url http://localhost:8000             --out-dir _ci_out/live_smoke             --compose-file docker-compose.yml             --latest-path latest.json

      - name: Capture ps + logs
        if: always()
        run: |
          docker compose -f docker-compose.yml ps > _ci_out/live_smoke/ps.txt || true
          docker compose -f docker-compose.yml logs --no-color > _ci_out/live_smoke/compose.log || true
          echo "=== meteovoid-api (tail) ==="
          docker compose -f docker-compose.yml logs --no-color --tail=200 meteovoid-api || true
          echo "=== _ci_out/live_smoke ==="
          ls -la _ci_out/live_smoke || true

      - name: Upload live smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke/

      - name: Down
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v
