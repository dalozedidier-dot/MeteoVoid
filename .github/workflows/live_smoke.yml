name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/live_smoke.yml"
      - "docker-compose.yml"
      - "docker-compose.ci.override.yml"
      - "src/**"
      - "tools/**"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (for bulletin tool)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[live]"
          python -c "import redis" || pip install redis

      - name: Prepare output dir
        run: |
          set -euo pipefail
          mkdir -p _ci_out/live_smoke

      - name: Build images
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml build

      - name: Up Redis
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d redis
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.override.yml exec -T redis redis-cli ping >/dev/null 2>&1; then
              echo "redis OK"
              exit 0
            fi
            sleep 1
          done
          echo "redis timeout"
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=200 redis || true
          exit 1

      - name: Up live + api
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d meteovoid-live meteovoid-api
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all || true

      - name: Wait /health (host poll)
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if python - <<'PY'
import json
from urllib.request import Request, urlopen
req = Request("http://localhost:8000/health", headers={"Accept":"application/json"})
data = urlopen(req, timeout=2).read().decode("utf-8", errors="replace")
obj = json.loads(data)
raise SystemExit(0 if isinstance(obj, dict) and obj.get("status") == "ok" else 1)
PY
            then
              echo "health OK"
              ok=1
              break
            fi

            # if API container died, fail early with logs
            if ! docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all | grep -E "meteovoid-api\s+.*\sUp\s" -q; then
              echo "API container is not running"
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all || true
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=300 meteovoid-api || true
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=300 meteovoid-live || true
              exit 1
            fi

            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "health timeout"
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all || true
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=300 meteovoid-api || true
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=300 meteovoid-live || true
            exit 1
          fi

      - name: Seed observations (host -> Redis Streams)
        run: |
          set -euo pipefail
          python - <<'PY'
import time
from typing import Any
import redis

r = redis.Redis(host="localhost", port=6379, db=0, decode_responses=True)
stream = "meteovoid:observations"

now = time.time()
# 250 points, 1s spacing, with one synthetic gap in the middle to exercise gap logic
for i in range(250):
    if i == 120:
        now += 90.0  # create a gap
    ts = now + i * 1.0
    fields: dict[str, Any] = {
        "station_id": "S1",
        "variable": "wind_speed_ms",
        "value": f"{5.0 + (i % 10) * 0.1:.3f}",
        "ts": str(ts),
    }
    r.xadd(stream, fields)
print("seeded", r.xlen(stream), "messages")
PY

      - name: Wait /latest and save latest.json
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 90); do
            if python - <<'PY'
import json
from urllib.request import Request, urlopen
req = Request("http://localhost:8000/latest", headers={"Accept":"application/json"})
data = urlopen(req, timeout=2).read().decode("utf-8", errors="replace")
obj = json.loads(data)
if isinstance(obj, dict) and ("score" in obj) and ("state" in obj):
    print(json.dumps(obj, ensure_ascii=False, indent=2))
    raise SystemExit(0)
raise SystemExit(1)
PY
            then
              python - <<'PY' > _ci_out/live_smoke/latest.json
import json
from urllib.request import Request, urlopen
req = Request("http://localhost:8000/latest", headers={"Accept":"application/json"})
data = urlopen(req, timeout=2).read().decode("utf-8", errors="replace")
obj = json.loads(data)
print(json.dumps(obj, ensure_ascii=False, indent=2))
PY
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "latest timeout"
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all || true
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=300 meteovoid-api || true
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=300 meteovoid-live || true
            exit 1
          fi

      - name: Generate bulletin (markdown + json + history)
        run: |
          set -euo pipefail
          python tools/postprocess_live_report.py             --latest _ci_out/live_smoke/latest.json             --out-dir _ci_out/live_smoke

      - name: Capture ps + logs
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps --all > _ci_out/live_smoke/ps.txt || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color > _ci_out/live_smoke/compose.log || true

      - name: Upload live smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke

      - name: Down
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml down -v || true
