# .github/workflows/live_smoke.yml
name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare output dir
        run: |
          set -euo pipefail
          mkdir -p _ci_out/live_smoke

      - name: Build images
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml build

      - name: Up Redis
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d redis

      - name: Up live + api
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d meteovoid-live meteovoid-api

      - name: Wait /health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done
          echo "health timeout"
          exit 1

      - name: Seed stream (simulate)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml run --rm meteovoid-simulate

      - name: Wait /latest enriched
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/latest > "$tmp"; then
              python - <<'PY' "$tmp" && mv "$tmp" _ci_out/live_smoke/latest.json && exit 0
import json, sys
p = sys.argv[1]
try:
    d = json.loads(open(p, "r", encoding="utf-8").read())
except Exception:
    sys.exit(1)
if not isinstance(d, dict):
    sys.exit(1)
ok = True
for k in ("score", "state", "station_id", "variable", "stream_id", "ts", "ts_ingest", "stats", "meteo"):
    ok = ok and (k in d)
if ok and isinstance(d.get("stats"), dict) and isinstance(d.get("meteo"), dict):
    if "n_points" in d["stats"] and "interpretation" in d["meteo"]:
        sys.exit(0)
sys.exit(1)
PY
            fi
            sleep 2
          done
          echo "/latest timeout or not enriched"
          exit 1

      - name: Validate latest.json (strict)
        run: |
          set -euo pipefail
          python tools/validate_latest_report.py _ci_out/live_smoke/latest.json

      - name: Capture ps
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml ps > _ci_out/live_smoke/ps.txt || true

      - name: Capture logs
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml logs --no-color > _ci_out/live_smoke/compose.log || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke/
          if-no-files-found: error

      - name: Down
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml down -v
