name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show tool versions (debug)
        run: |
          python -V
          pip -V
          docker version
          docker compose version

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build

      - name: Start services (redis + live + api)
        run: |
          docker compose -f docker-compose.yml up -d redis meteovoid-live meteovoid-api
          docker compose -f docker-compose.yml ps

      - name: Wait for API /health
        run: |
          python - <<'PY'
          import json, time
          from urllib.request import urlopen, Request
          url = "http://localhost:8000/health"
          t0 = time.time()
          while True:
            try:
              req = Request(url, headers={"Accept":"application/json"})
              with urlopen(req, timeout=2.0) as r:
                data = r.read().decode("utf-8", errors="replace")
              obj = json.loads(data)
              if isinstance(obj, dict) and obj.get("status") == "ok":
                print("health ok")
                break
            except Exception:
              pass
            if time.time() - t0 > 60:
              raise SystemExit("API /health not ready after 60s")
            time.sleep(1.0)
          PY

      - name: Seed observations (simulate)
        run: |
          docker compose -f docker-compose.yml run --rm meteovoid-simulate

      - name: Wait for /latest and save latest.json
        run: |
          mkdir -p _ci_out/live_smoke
          python - <<'PY'
          import json, time
          from pathlib import Path
          from urllib.request import urlopen, Request

          url = "http://localhost:8000/latest"
          out = Path("_ci_out/live_smoke/latest.json")
          t0 = time.time()
          last = None
          while True:
            try:
              req = Request(url, headers={"Accept":"application/json"})
              with urlopen(req, timeout=2.5) as r:
                data = r.read().decode("utf-8", errors="replace")
              obj = json.loads(data)
              last = obj
              if isinstance(obj, dict) and obj.get("score") is not None and obj.get("state") is not None:
                out.write_text(json.dumps(obj, indent=2, sort_keys=True), encoding="utf-8")
                print("saved", out)
                break
            except Exception as e:
              last = {"error": str(e)}
            if time.time() - t0 > 90:
              raise SystemExit(f"/latest not ready after 90s, last={last}")
            time.sleep(1.0)
          PY

      - name: Generate bulletin (md + json + history)
        run: |
          python tools/generate_bulletin.py             --api-url http://localhost:8000             --out-dir _ci_out/live_smoke             --compose-file docker-compose.yml

      - name: Capture compose logs + ps
        if: always()
        run: |
          mkdir -p _ci_out/live_smoke
          docker compose -f docker-compose.yml ps > _ci_out/live_smoke/ps.txt || true
          docker compose -f docker-compose.yml logs --no-color > _ci_out/live_smoke/compose.log || true
          echo "=== _ci_out/live_smoke contents ==="
          ls -la _ci_out/live_smoke || true

      - name: Upload live smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke/

      - name: Shutdown
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v
