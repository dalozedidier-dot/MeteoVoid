# .github/workflows/live_smoke.yml
name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling (viz)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "matplotlib>=3.8"

      - name: Prepare output dir
        run: |
          set -euo pipefail
          mkdir -p _ci_out/live_smoke

      - name: Build images
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml build

      - name: Up Redis
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d redis

      - name: Up live + api
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d meteovoid-live meteovoid-api
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps

      - name: Wait /health (inside meteovoid-api)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            out="$(
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml exec -T meteovoid-api \
                python -c "import json,urllib.request; print(json.loads(urllib.request.urlopen('http://localhost:8000/health',timeout=2).read().decode()).get('status',''))" \
                2>/dev/null || true
            )"
            if echo "$out" | grep -qi "ok"; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done

          echo "health timeout"
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=200 meteovoid-api || true
          exit 1

      - name: Seed stream (simulate) and assert XLEN > 0
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml run --rm meteovoid-simulate

          xlen="$(
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml exec -T redis \
              sh -lc "redis-cli XLEN meteovoid:observations" \
              2>/dev/null | tr -d '\r' | tail -n 1
          )"
          echo "XLEN(meteovoid:observations)=$xlen"
          if [ -z "$xlen" ] || [ "$xlen" -le 0 ]; then
            echo "simulate produced no messages; dumping logs"
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=400 meteovoid-simulate || true
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=400 meteovoid-live || true
            exit 1
          fi

      - name: Wait for /stations to become non-empty
        run: |
          set -euo pipefail
          fetch() {
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml exec -T meteovoid-api \
              python -c "import sys,urllib.request; print(urllib.request.urlopen(sys.argv[1],timeout=2).read().decode())" \
              "$1" 2>/dev/null
          }

          tmp_stations="$(mktemp)"
          for i in $(seq 1 60); do
            if fetch "http://localhost:8000/stations" >"$tmp_stations"; then
              ok="$(
                python -c "import json,sys; d=json.load(open(sys.argv[1],'r',encoding='utf-8')); st=d.get('stations',{}); print('1' if isinstance(st,dict) and len(st)>0 else '0')" \
                  "$tmp_stations" 2>/dev/null || echo 0
              )"
              if [ "$ok" = "1" ]; then
                echo "stations OK"
                cat "$tmp_stations"
                exit 0
              fi
            fi
            sleep 2
          done

          echo "stations stayed empty"
          cat "$tmp_stations" || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color --tail=400 meteovoid-live || true
          exit 1

      - name: Fetch /latest (inside meteovoid-api)
        run: |
          set -euo pipefail
          tmp_latest="$(mktemp)"
          tmp_stations="$(mktemp)"
          pair="$(mktemp)"
          station_id=""
          variable=""

          fetch() {
            local url="$1"
            docker compose -f docker-compose.yml -f docker-compose.ci.override.yml exec -T meteovoid-api \
              python -c "import sys,urllib.request; print(urllib.request.urlopen(sys.argv[1],timeout=2).read().decode())" \
              "$url" \
              2>/dev/null
          }

          fetch "http://localhost:8000/stations" >"$tmp_stations"
          python -c "import json,sys; d=json.load(open(sys.argv[1], 'r', encoding='utf-8')); st=d.get('stations', {}); sid=sorted(st.keys())[0] if isinstance(st, dict) and st else ''; vv=st.get(sid, []) if isinstance(st, dict) else []; var=sorted([x for x in vv if isinstance(x, str) and x])[0] if isinstance(vv, list) and vv else ''; print(sid); print(var)" \
            "$tmp_stations" >"$pair" 2>/dev/null || true
          station_id="$(sed -n '1p' "$pair")"
          variable="$(sed -n '2p' "$pair")"

          for i in $(seq 1 90); do
            if [ -n "$station_id" ] && [ -n "$variable" ]; then
              url="http://localhost:8000/latest?station_id=${station_id}&variable=${variable}"
              if fetch "$url" >"$tmp_latest"; then
                if python tools/validate_latest_report.py "$tmp_latest" >/dev/null 2>&1; then
                  mv "$tmp_latest" _ci_out/live_smoke/latest.json
                  echo "latest OK (station_id=$station_id variable=$variable)"
                  exit 0
                fi
              fi
            fi

            if fetch "http://localhost:8000/latest" >"$tmp_latest"; then
              if python tools/validate_latest_report.py "$tmp_latest" >/dev/null 2>&1; then
                mv "$tmp_latest" _ci_out/live_smoke/latest.json
                echo "latest OK (no params)"
                exit 0
              fi
            fi

            sleep 2
          done

          echo "/latest timeout or invalid"
          echo "--- stations payload ---"
          cat "$tmp_stations" || true
          echo "--- latest validation ---"
          python tools/validate_latest_report.py "$tmp_latest" || true
          echo "--- latest payload ---"
          cat "$tmp_latest" || true
          exit 1

      - name: Validate latest.json (strict)
        run: |
          set -euo pipefail
          python tools/validate_latest_report.py _ci_out/live_smoke/latest.json

      - name: Generate bulletin + history + incoherence
        run: |
          set -euo pipefail
          python tools/postprocess_live_report.py \
            --latest _ci_out/live_smoke/latest.json \
            --out-dir _ci_out/live_smoke \
            --config config/incoherence.json

      - name: Generate anomaly plots (PNG)
        run: |
          set -euo pipefail
          python tools/plot_live_smoke.py \
            --out-dir _ci_out/live_smoke \
            --history _ci_out/live_smoke/history.csv \
            --latest _ci_out/live_smoke/latest_enriched.json

      - name: Capture ps
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps > _ci_out/live_smoke/ps.txt || true

      - name: Capture logs
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --no-color > _ci_out/live_smoke/compose.log || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke/
          if-no-files-found: error

      - name: Down
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml down -v
