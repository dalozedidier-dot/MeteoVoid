# .github/workflows/live_smoke.yml
name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare output dir
        run: |
          set -euo pipefail
          mkdir -p _ci_out/live_smoke

      - name: Build images
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml build

      - name: Up Redis
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d redis

      - name: Up live + api
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d meteovoid-live meteovoid-api

      - name: Wait /health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done
          echo "health timeout"
          exit 1

      - name: Seed stream (simulate)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml run --rm meteovoid-simulate

      - name: Wait /latest enriched (supports required query params)
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          pair="$(mktemp)"

          station_id=""
          variable=""

          for i in $(seq 1 90); do
            # Try /latest without params
            code="$(curl -sS -o "$tmp" -w "%{http_code}" http://localhost:8000/latest || true)"

            if [ "$code" = "200" ]; then
              if python tools/validate_latest_report.py "$tmp" >/dev/null 2>&1; then
                mv "$tmp" _ci_out/live_smoke/latest.json
                echo "latest OK (no params)"
                exit 0
              fi
            fi

            # If API requires query params (FastAPI Query(...)), discover first pair via /stations
            if [ "$code" = "422" ]; then
              if [ -z "$station_id" ] || [ -z "$variable" ]; then
                st_code="$(curl -sS -o "$tmp" -w "%{http_code}" http://localhost:8000/stations || true)"
                if [ "$st_code" = "200" ]; then
                  python -c "import json,sys; d=json.load(open(sys.argv[1], 'r', encoding='utf-8')); st=d.get('stations', {}); sid=sorted(st.keys())[0] if isinstance(st, dict) and st else ''; vv=st.get(sid, []) if isinstance(st, dict) else []; var=sorted([x for x in vv if isinstance(x, str) and x])[0] if isinstance(vv, list) and vv else ''; print(sid); print(var)" "$tmp" > "$pair" 2>/dev/null || true
                  station_id="$(sed -n '1p' "$pair")"
                  variable="$(sed -n '2p' "$pair")"
                fi
              fi

              if [ -n "$station_id" ] && [ -n "$variable" ]; then
                url="http://localhost:8000/latest?station_id=${station_id}&variable=${variable}"
                code2="$(curl -sS -o "$tmp" -w "%{http_code}" "$url" || true)"
                if [ "$code2" = "200" ]; then
                  if python tools/validate_latest_report.py "$tmp" >/dev/null 2>&1; then
                    mv "$tmp" _ci_out/live_smoke/latest.json
                    echo "latest OK (station_id=$station_id variable=$variable)"
                    exit 0
                  fi
                fi
              fi
            fi

            sleep 2
          done

          echo "/latest timeout or invalid"
          echo "Last HTTP code (no params): $code"
          if [ -n "$station_id" ] && [ -n "$variable" ]; then
            echo "Tried station_id=$station_id variable=$variable"
          fi
          if [ -s "$tmp" ]; then
            echo "--- validation ---"
            python tools/validate_latest_report.py "$tmp" || true
            echo "--- payload ---"
            cat "$tmp" || true
          else
            echo "(empty response)"
          fi
          exit 1

      - name: Validate latest.json (strict)
        run: |
          set -euo pipefail
          python tools/validate_latest_report.py _ci_out/live_smoke/latest.json

      - name: Generate bulletin + history (incoherence)
        run: |
          set -euo pipefail
          python tools/generate_bulletin.py --latest _ci_out/live_smoke/latest.json --out-dir _ci_out/live_smoke --config config/incoherence_defaults.json

      - name: Capture ps
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml ps > _ci_out/live_smoke/ps.txt || true

      - name: Capture logs
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml logs --no-color > _ci_out/live_smoke/compose.log || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke/
          if-no-files-found: error

      - name: Down
        if: always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml down -v
