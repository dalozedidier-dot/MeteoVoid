name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          docker version
          docker compose version

      - name: Build and start stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Push synthetic live data
        run: |
          docker compose run --rm meteovoid-live \
            simulate \
              --redis-url redis://redis:6379/0 \
              --station-id DEMO_BE_0001 \
              --variable wind_gust_ms \
              --steps 200 \
              --sleep 0.01

      - name: Verify latest report endpoint
        run: |
          curl -fsS "http://localhost:8000/latest?station_id=DEMO_BE_0001&variable=wind_gust_ms" | tee latest.json
          python - <<'PY'
          import json
          with open("latest.json","r",encoding="utf-8") as f:
            data=json.load(f)
          assert "score" in data, data
          assert "state" in data, data
          assert data["state"] in ("stable","transition","unstable"), data
          print("OK:", data["state"], data["score"])
          PY

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
