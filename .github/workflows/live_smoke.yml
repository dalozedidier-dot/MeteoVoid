name: Live Smoke (Docker Compose)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          docker version
          docker compose version

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build

      - name: Start Redis only
        run: |
          docker compose -f docker-compose.yml up -d redis
          docker compose -f docker-compose.yml ps

      - name: Push synthetic live data (seed stream)
        run: |
          docker compose -f docker-compose.yml run --rm meteovoid-simulate

      - name: Start live services
        run: |
          docker compose -f docker-compose.yml up -d meteovoid-live meteovoid-api
          docker compose -f docker-compose.yml ps

      - name: Wait for API to be ready
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color
          exit 1

      - name: Wait for first live report
        run: |
          for i in $(seq 1 30); do
            echo "Checking for live report ($i)"
            curl -fsS "http://localhost:8000/latest?station_id=DEMO_BE_0001&variable=wind_gust_ms" \
              | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if ('score' in d and 'state' in d) else 1)" \
              && echo "Report OK" && exit 0 || true
            sleep 2
          done

          echo "No live report produced in time"
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color
          exit 1

      - name: Save report + logs (for artifact)
        if: always()
        run: |
          mkdir -p _ci_out/live_smoke
          # try to save latest report (may fail if API never came up)
          curl -fsS "http://localhost:8000/latest?station_id=DEMO_BE_0001&variable=wind_gust_ms" \
            > _ci_out/live_smoke/latest.json || true
          docker compose -f docker-compose.yml ps > _ci_out/live_smoke/ps.txt || true
          docker compose -f docker-compose.yml logs --no-color > _ci_out/live_smoke/compose.log || true

      - name: Upload live-smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_smoke_report
          path: _ci_out/live_smoke/

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v
