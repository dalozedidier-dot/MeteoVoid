contract: meteovoid_european_national_radars_config_v2
updated: "2026-06-18"

# National radar registry for the Europe page. The registry intentionally
# separates display layers, machine-readable radar, forecast/nowcast products
# and fallback layers. MeteoVoid only promotes a source to machine radar
# evidence when a local/downloaded file is readable and metrics are computed.

output_files:
  status_json: european_national_radar_status.json
  metrics_json: european_national_radar_metrics.json
  sources_csv: european_national_radar_sources.csv
  map_html: european_national_radar_map.html
  report_md: european_national_radar_report.md

runtime:
  default_timeout_seconds: 8
  max_probe_bytes: 2048
  user_agent: "MeteoVoid-EuropeanNationalRadar/2.0"

pan_european_layers:
  - id: rainviewer_display
    provider: "RainViewer"
    role: "display_radar_tiles"
    evidence_level: "display_only"
    expected_format: "XYZ_tiles_JSON_timeline"
    update_interval_minutes: 10
    public_reference: "https://www.rainviewer.com/api/weather-maps-api.html"
    note: "Immediate visual radar layer. Display only, not machine evidence."
  - id: opera_ord_composite
    provider: "EUMETNET OPERA ORD / MeteoGate"
    role: "pan_european_machine_radar"
    evidence_level: "machine_radar_optional"
    expected_format: "ODIM_HDF5_or_GeoTIFF"
    update_interval_minutes: 5
    public_reference: "https://eumetnet.github.io/openradardata-documentation/"
    note: "Preferred unified machine radar path when enabled and files are available."
  - id: openmeteo_fallback
    provider: "Open-Meteo"
    role: "model_fallback_flux_indices"
    evidence_level: "model_fallback"
    expected_format: "JSON_hourly_model_fields"
    update_interval_minutes: 60
    public_reference: "https://open-meteo.com/"
    note: "Fallback for flow, pressure levels and convective proxies. Not radar evidence."

countries:
  spain:
    label: "Espagne"
    iso2: "ES"
    bbox: {west: -10.0, south: 35.5, east: 4.6, north: 44.4}
    upstream_role: "réservoir chaleur et humidité, convection ibérique et advection sud-ouest vers France puis Belgique"
    belgium_relevance: "indirecte mais importante lors des épisodes chaleur-humidité remontant par golfe de Gascogne et France"
    priority_for_belgium: medium
    corridor_family: "Iberia -> Golfe de Gascogne -> France -> Belgique"
    watch_zones:
      - "nord de l'Espagne"
      - "Pyrénées"
      - "golfe de Gascogne"
      - "Catalogne et vallée de l'Ebre lors des flux sud"
    required_env:
      - AEMET_API_KEY
    sources:
      - id: aemet_opendata_national_composite
        provider: "AEMET OpenData"
        role: "national_radar_composite"
        evidence_level: "api_required"
        api_key_env: "AEMET_API_KEY"
        endpoint_template: "https://opendata.aemet.es/opendata/api/red/radar/nacional?api_key={api_key}"
        expected_format: "image_or_redirect_json"
        update_interval_minutes: 30
        source_family: "national_api"
        license_note: "AEMET OpenData, API key required, reuse subject to AEMET conditions."
        public_reference: "https://opendata.aemet.es/"
      - id: aemet_opendata_regional_radars
        provider: "AEMET OpenData"
        role: "regional_radar_images"
        evidence_level: "api_required"
        api_key_env: "AEMET_API_KEY"
        endpoint_template: "https://opendata.aemet.es/opendata/api/red/radar/regional/{region}?api_key={api_key}"
        expected_format: "image_or_redirect_json"
        update_interval_minutes: 30
        source_family: "national_api"
        note: "Regional endpoint template. Region must be specified before live use."
        public_reference: "https://opendata.aemet.es/centrodedescargas/productosAEMET"
      - id: opera_ord_spain_composite
        provider: "EUMETNET OPERA ORD"
        role: "pan_european_machine_radar"
        evidence_level: "opera_ord_fallback"
        expected_format: "ODIM_HDF5_or_GeoTIFF"
        source_family: "opera_fallback"
        public_reference: "https://eumetnet.github.io/openradardata-documentation/"
      - id: rainviewer_spain_display
        provider: "RainViewer"
        role: "visual_radar_tiles"
        evidence_level: "display_only"
        expected_format: "XYZ_tiles"
        source_family: "display"
        public_reference: "https://www.rainviewer.com/api/weather-maps-api.html"

  france:
    label: "France"
    iso2: "FR"
    bbox: {west: -5.8, south: 41.0, east: 9.9, north: 51.5}
    upstream_role: "principal couloir amont vers Belgique : Hauts-de-France, Manche, Champagne-Ardenne, Grand Est"
    belgium_relevance: "directe, souvent décisive pour anticiper l'entrée des cellules par Hainaut, Flandre, Brabant wallon, Namur et Ardenne"
    priority_for_belgium: high
    corridor_family: "France nord -> Belgique"
    watch_zones:
      - "Hauts-de-France"
      - "Champagne-Ardenne"
      - "Grand Est"
      - "Normandie et Manche"
      - "Bassin parisien"
    required_env:
      - METEOFRANCE_API_KEY
    sources:
      - id: meteofrance_api_radar_package
        provider: "Météo-France API / Données publiques Radar"
        role: "national_radar_package"
        evidence_level: "api_required"
        api_key_env: "METEOFRANCE_API_KEY"
        endpoint_template: ""
        expected_format: "provider_specific_radar_package"
        update_interval_minutes: 5
        source_family: "national_api"
        license_note: "Accès via portail API Météo-France, compte requis selon le service."
        public_reference: "https://www.data.gouv.fr/dataservices/api-donnees-radar"
      - id: aeris_meteofrance_radar_network
        provider: "AERIS / Réseau radar Météo-France"
        role: "research_radar_archive_and_products"
        evidence_level: "catalogue_or_account_required"
        endpoint_template: ""
        expected_format: "mosaic_and_raw_products"
        update_interval_minutes: null
        source_family: "research_catalogue"
        note: "Useful for historical validation and product discovery, not assumed live by default."
        public_reference: "https://www.aeris-data.fr/en/projects/meteo-france-radar-network/"
      - id: meteofrance_public_radar_display
        provider: "Météo-France"
        role: "public_radar_display"
        evidence_level: "display_only"
        endpoint_template: ""
        expected_format: "web_map_display"
        update_interval_minutes: 5
        source_family: "display"
        public_reference: "https://meteofrance.com/images-radar"
      - id: opera_ord_france_composite
        provider: "EUMETNET OPERA ORD"
        role: "pan_european_machine_radar"
        evidence_level: "opera_ord_fallback"
        expected_format: "ODIM_HDF5_or_GeoTIFF"
        source_family: "opera_fallback"
        public_reference: "https://eumetnet.github.io/openradardata-documentation/"
      - id: rainviewer_france_display
        provider: "RainViewer"
        role: "visual_radar_tiles"
        evidence_level: "display_only"
        expected_format: "XYZ_tiles"
        source_family: "display"
        public_reference: "https://www.rainviewer.com/api/weather-maps-api.html"

  switzerland:
    label: "Suisse"
    iso2: "CH"
    bbox: {west: 5.6, south: 45.7, east: 10.7, north: 47.9}
    upstream_role: "convection alpine, flux Jura-Alpes et signaux pouvant remonter vers est France, Allemagne puis Belgique"
    belgium_relevance: "indirecte, utile pour lire la dynamique alpine et les retours par Grand Est ou Allemagne"
    priority_for_belgium: medium
    corridor_family: "Alpes/Jura -> Est France/Allemagne -> Belgique"
    watch_zones:
      - "Jura"
      - "Plateau suisse"
      - "Alpes nord"
      - "région bâloise"
    required_env: []
    sources:
      - id: meteoswiss_precip_stac
        provider: "MeteoSwiss Open Data"
        role: "precipitation_radar_products"
        evidence_level: "stac_open_data"
        endpoint_template: "https://data.geo.admin.ch/api/stac/v0.9/collections/ch.meteoschweiz.ogd-radar-precip"
        expected_format: "STAC_assets"
        update_interval_minutes: 5
        source_family: "stac_open_data"
        license_note: "MeteoSwiss Open Government Data. Radar precipitation products through STAC/Open Data."
        public_reference: "https://opendatadocs.meteoswiss.ch/d-radar-data/d1-precipitation-radar-products"
      - id: meteoswiss_hail_radar_products
        provider: "MeteoSwiss Open Data"
        role: "hail_radar_products"
        evidence_level: "stac_open_data"
        endpoint_template: ""
        expected_format: "STAC_assets"
        update_interval_minutes: 5
        source_family: "stac_open_data"
        note: "Hail radar products are listed as open radar products. Endpoint collection can be added when confirmed."
        public_reference: "https://www.meteoswiss.admin.ch/services-and-publications/service/open-data.html"
      - id: meteoswiss_nowcasting_request
        provider: "MeteoSwiss Open Data"
        role: "short_term_nowcasting"
        evidence_level: "data_on_request"
        endpoint_template: ""
        expected_format: "1km_nowcast_data_on_request"
        update_interval_minutes: 5
        source_family: "forecast_nowcast"
        public_reference: "https://opendatadocs.meteoswiss.ch/e-forecast-data"
      - id: opera_ord_switzerland_composite
        provider: "EUMETNET OPERA ORD"
        role: "pan_european_machine_radar"
        evidence_level: "opera_ord_fallback"
        expected_format: "ODIM_HDF5_or_GeoTIFF"
        source_family: "opera_fallback"
        public_reference: "https://eumetnet.github.io/openradardata-documentation/"
      - id: rainviewer_switzerland_display
        provider: "RainViewer"
        role: "visual_radar_tiles"
        evidence_level: "display_only"
        expected_format: "XYZ_tiles"
        source_family: "display"
        public_reference: "https://www.rainviewer.com/api/weather-maps-api.html"

  netherlands:
    label: "Pays-Bas"
    iso2: "NL"
    bbox: {west: 3.0, south: 50.6, east: 7.4, north: 53.8}
    upstream_role: "retour nord-ouest, mer du Nord, cellules vers Flandre, Anvers, Limbourg et est Belgique"
    belgium_relevance: "directe pour flux nord-ouest, mer du Nord, Flandre, Anvers, Limbourg et retour vers Liège"
    priority_for_belgium: high
    corridor_family: "Mer du Nord / Pays-Bas -> Belgique nord et est"
    watch_zones:
      - "Zélande"
      - "Brabant-Septentrional"
      - "Limbourg néerlandais"
      - "mer du Nord"
      - "Randstad lors des lignes convectives"
    required_env:
      - KNMI_API_KEY
    sources:
      - id: knmi_radar_reflectivity_composites
        provider: "KNMI Data Platform"
        role: "5_min_reflectivity_composites"
        evidence_level: "open_data_api"
        api_key_env: "KNMI_API_KEY"
        endpoint_template: "https://api.dataplatform.knmi.nl/open-data/v1/datasets/radar_reflectivity_composites/versions/2.0/files"
        expected_format: "HDF5"
        update_interval_minutes: 5
        source_family: "national_api"
        license_note: "KNMI Data Platform, Open Data API, CC-BY-4.0 according to dataset metadata."
        public_reference: "https://dataplatform.knmi.nl/dataset/access/radar-reflectivity-composites-2-0"
      - id: knmi_radar_gauge_5min_realtime
        provider: "KNMI Data Platform"
        role: "5_min_radar_gauge_accumulations"
        evidence_level: "open_data_api"
        api_key_env: "KNMI_API_KEY"
        endpoint_template: "https://api.dataplatform.knmi.nl/open-data/v1/datasets/radar_precipitation_composites_nl/versions/latest/files"
        expected_format: "HDF5"
        update_interval_minutes: 5
        source_family: "national_api"
        public_reference: "https://dataplatform.knmi.nl/dataset/?tags=Radar"
      - id: knmi_radar_nowcast_2h
        provider: "KNMI Data Platform"
        role: "radar_nowcast_0_120min"
        evidence_level: "open_data_api"
        api_key_env: "KNMI_API_KEY"
        endpoint_template: "https://api.dataplatform.knmi.nl/open-data/v1/datasets/radar_forecast/versions/2.0/files"
        expected_format: "HDF5_or_TXT"
        update_interval_minutes: 5
        source_family: "national_nowcast"
        note: "Operational nowcast up to 2 hours, according to KNMI dataset description."
        public_reference: "https://dataplatform.knmi.nl/dataset/radar-forecast-2-0"
      - id: knmi_wms_precipitation
        provider: "KNMI WMS API"
        role: "web_mapping_service"
        evidence_level: "wms_open_data"
        endpoint_template: ""
        expected_format: "OGC_WMS"
        update_interval_minutes: 5
        source_family: "wms_display"
        public_reference: "https://developer.dataplatform.knmi.nl/wms"
      - id: opera_ord_netherlands_composite
        provider: "EUMETNET OPERA ORD"
        role: "pan_european_machine_radar"
        evidence_level: "opera_ord_fallback"
        expected_format: "ODIM_HDF5_or_GeoTIFF"
        source_family: "opera_fallback"
        public_reference: "https://eumetnet.github.io/openradardata-documentation/"
      - id: rainviewer_netherlands_display
        provider: "RainViewer"
        role: "visual_radar_tiles"
        evidence_level: "display_only"
        expected_format: "XYZ_tiles"
        source_family: "display"
        public_reference: "https://www.rainviewer.com/api/weather-maps-api.html"
