# MeteoVoid - per-country radar networks and detection station grids.
#
# Goal: bring each European country up to the same level of follow-up as the
# Belgium page. For every country we list:
#   - radars : the real national weather-radar network sites (physical radar
#              positions). Coordinates are the publicly documented network
#              locations and are approximate to ~0.05 deg. They need no API key
#              and are drawn as markers on the country map (like Belgium).
#   - stations : a denser observation grid (real cities) used by the generic
#              MeteoVoid detection engine to score each country, exactly like the
#              Belgium per-station scoring.
#
# Live data uses the national APIs when their key is configured in the
# environment (AEMET_API_KEY, METEOFRANCE_API_KEY, KNMI_API_KEY) and Open-Meteo
# for observations. Without a key MeteoVoid stays honest: the radar network is
# displayed, but the layer is flagged "interface ready / awaiting national key"
# and never promoted to machine evidence.
contract: meteovoid_country_radar_sites_v1
updated: "2026-06-18"
note: "Official national radar network positions, approximate to ~0.05 deg, no key required to display."

