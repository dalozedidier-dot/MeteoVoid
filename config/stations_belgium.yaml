    region: belgium_center
    lat: 50.7989
    lon: 4.3583
    source: openmeteo
    variables: &vars [temperature_2m, relative_humidity_2m, dew_point_2m, precipitation_probability, precipitation, rain, showers, weather_code, pressure_msl, wind_speed_10m, wind_gusts_10m]

