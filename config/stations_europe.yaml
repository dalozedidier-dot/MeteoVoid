# MeteoVoid stations config (Europe starter set)
# Source: Open-Meteo (no key), current conditions
#
# Variables: Open-Meteo "current" names
# - wind_speed_10m (m/s)
# - wind_gusts_10m (m/s)
# - temperature_2m (°C)
# - surface_pressure (hPa)

stations:
