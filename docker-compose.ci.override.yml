services:
  meteovoid-api:
    # The built image uses ENTRYPOINT=["meteovoid"].
    # Use the CLI subcommand instead of "python -m uvicorn".
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); json.loads(r.read().decode('utf-8')); print('ok')",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  meteovoid-live:
    command:
      - live
      - --redis-url
      - redis://redis:6379/0
      - --in-stream
      - meteovoid:observations
      - --out-stream
      - meteovoid:reports

  meteovoid-simulate:
    command:
      - simulate
      - --redis-url
      - redis://redis:6379/0
      - --out-stream
      - meteovoid:observations
      - --n
      - "250"
