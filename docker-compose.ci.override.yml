services:
  meteovoid-api:
    # Image ENTRYPOINT=["meteovoid"] breaks any "python ..." command by turning it into:
    #   meteovoid python ...
    # So in CI we replace the entrypoint and run uvicorn directly.
    entrypoint: ["sh", "-lc"]
    command: >
      python -m uvicorn meteovoid.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); json.loads(r.read().decode('utf-8')); print('ok')",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  meteovoid-live:
    # Same ENTRYPOINT issue: base compose uses a python entrypoint, which becomes "meteovoid python ..."
    entrypoint: ["sh", "-lc"]
    command: >
      meteovoid live --redis-url redis://redis:6379/0
      --in-stream meteovoid:observations --out-stream meteovoid:reports

  meteovoid-simulate:
    # Ensure seeding works when workflow prefers the simulate service.
    entrypoint: ["sh", "-lc"]
    command: >
      meteovoid simulate --redis-url redis://redis:6379/0
      --out-stream meteovoid:observations --n 250
