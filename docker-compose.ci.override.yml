services:
  meteovoid-api:
    # The built image uses ENTRYPOINT=["meteovoid"].
    # If command is ["python", "-m", "..."], Docker runs: meteovoid python -m ...
    # So in CI we override the entrypoint to a shell and run uvicorn directly.
    entrypoint: ["sh", "-lc"]
    command: >
      python -m uvicorn meteovoid.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); json.loads(r.read().decode('utf-8')); print('ok')",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  meteovoid-live:
    # Same ENTRYPOINT issue as meteovoid-api (compose ps showed: "meteovoid python -m ...").
    # Override entrypoint and run the CLI explicitly.
    entrypoint: ["sh", "-lc"]
    command: >
      meteovoid live --redis-url redis://redis:6379/0
      --in-stream meteovoid:observations --out-stream meteovoid:reports
