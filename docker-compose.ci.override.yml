services:
  meteovoid-api:
    # The image sets ENTRYPOINT=["meteovoid"], which makes any command run as:
    #   meteovoid <command...>
    # That broke the API container with: "No such command 'python'".
    #
    # In CI we override the entrypoint to run uvicorn directly.
    entrypoint:
      - python
      - -m
      - uvicorn
    command:
      - meteovoid.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); json.loads(r.read().decode('utf-8')); print('ok')",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
