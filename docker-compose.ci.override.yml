services:
  meteovoid-api:
    # Image ENTRYPOINT is "meteovoid". Do NOT call uvicorn subcommand (it doesn't exist).
    # Use the built-in CLI "serve".
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

  meteovoid-live:
    # Use CLI "live" (avoid "python -m ..." which becomes "meteovoid python -m ...")
    command:
      - live
      - --redis-url
      - redis://redis:6379/0
      - --in-stream
      - meteovoid:observations
      - --out-stream
      - meteovoid:reports

  meteovoid-simulate:
    command:
      - simulate
      - --redis-url
      - redis://redis:6379/0
      - --out-stream
      - meteovoid:observations
      - --n
      - "250"
