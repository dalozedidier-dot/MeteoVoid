[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo-void"
version = "0.3.0"
description = "Graph-based upstream weather silence & anomaly detector – voids before the storm"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "MeteoVoid contributors"}]
dependencies = [
  "numpy>=2.4.4",
  "pandas>=2.0",
  "numpy>=1.24",
  "pandas>=3.0.2",
  "networkx>=3.2",
  "pandas>=2.0",
  "networkx>=3.6.1",
  "pydantic>=2.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
live = [
  "redis>=5.0",
  "fastapi>=0.135.3",
  "redis>=7.4.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg2-binary>=2.9",
]

io = [
  "pyarrow>=15; python_version>='3.11'",
  "xarray>=2026.2.0",
  "cfgrib>=0.9.10.4",
]

viz = [
  "matplotlib>=3.8",
]


dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.15.1",
  "hypothesis>=6.100",
  "pandas-stubs>=2.0",
  "pre-commit>=3.7",
  "ruff>=0.6.0",
  "black>=26.3.1",
  "ruff>=0.15.10",
  "black>=24.0",
  "mypy>=1.10",
  "types-setuptools",
]

[project.scripts]
meteovoid = "meteovoid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["meteovoid"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
addopts = "-q --cov=meteovoid --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/meteovoid/cli.py" = ["B008"]
