services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meteovoid
      POSTGRES_USER: meteovoid
      POSTGRES_PASSWORD: meteovoid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteovoid -d meteovoid"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # NOTE: the Docker image sets ENTRYPOINT ["meteovoid"].
  # Therefore service commands must be MeteoVoid CLI subcommands (scan/simulate/live/serve/ingest),
  # not "python -m ..." nor "uvicorn ...".

  meteovoid-ingest-europe:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    command:
      - ingest
      - --config
      - config/stations_europe.yaml
      - --redis-url
      - redis://redis:6379/0
      - --out-stream
      - meteovoid:observations
      - --poll-seconds
      - "60"
    restart: unless-stopped

  meteovoid-live:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://meteovoid:meteovoid@postgres:5432/meteovoid
    command:
      - live
      - --redis-url
      - redis://redis:6379/0
      - --in-stream
      - meteovoid:observations
      - --out-stream
      - meteovoid:reports
    restart: unless-stopped

  meteovoid-api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://meteovoid:meteovoid@postgres:5432/meteovoid
      METEOVOID_API_TOKEN: ${METEOVOID_API_TOKEN:-}
    ports:
      - "8000:8000"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request;print(json.loads(urllib.request.urlopen('http://localhost:8000/health',timeout=2).read().decode())['status'])",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Dev/demo mode only: generates synthetic observations instead of real data.
  # Activate with: docker compose --profile demo up
  meteovoid-simulate:
    profiles: [demo]
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    command:
      - simulate
      - --redis-url
      - redis://redis:6379/0
      - --stream
      - meteovoid:observations
      - --station-id
      - DEMO_BE_0001
      - --variable
      - wind_gust_ms
      - --steps
      - "250"
      - --sleep
      - "0.01"

volumes:
  postgres_data:
