services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  meteovoid-live:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Live-smoke seeds BEFORE starting the worker. With "$" the worker would ignore seed messages.
      METEOVOID_START_ID: "0-0"
    command:
      [
        "live",
        "--redis-url",
        "redis://redis:6379/0",
        "--in-stream",
        "meteovoid:observations",
        "--out-stream",
        "meteovoid:reports"
      ]
    restart: unless-stopped

  meteovoid-api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  meteovoid-simulate:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    command:
      [
        "simulate",
        "--redis-url",
        "redis://redis:6379/0",
        "--stream",
        "meteovoid:observations",
        "--station-id",
        "DEMO_BE_0001",
        "--variable",
        "wind_gust_ms",
        "--steps",
        "250",
        "--sleep",
        "0.01"
      ]
    restart: "no"
