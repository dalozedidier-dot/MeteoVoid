version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meteovoid-live:
    build: .
    depends_on:
      - redis
    command: ["live", "--redis-url", "redis://redis:6379/0"]
    restart: unless-stopped

  meteovoid-api:
    build: .
    depends_on:
      - redis
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
