services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  meteovoid-live:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    command:
      - live
      - --redis-url
      - redis://redis:6379/0
      - --in-stream
      - meteovoid:observations
      - --out-stream
      - meteovoid:reports

  meteovoid-api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      METEOVOID_OUT_STREAM: meteovoid:reports
    ports:
      - "8000:8000"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request;print(json.loads(urllib.request.urlopen('http://localhost:8000/health',timeout=2).read().decode())['status'])",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  meteovoid-simulate:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    command:
      - simulate
      - --redis-url
      - redis://redis:6379/0
      - --stream
      - meteovoid:observations
      - --station-id
      - DEMO_BE_0001
      - --variable
      - wind_gust_ms
      - --steps
      - "350"
      - --sleep
      - "0.01"
