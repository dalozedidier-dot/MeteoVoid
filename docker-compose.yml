version: "3.9"

services:
  redis:
    image: redis:7-alpine
    # Décommente si tu as besoin d'accéder à Redis depuis ta machine
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  meteovoid-live:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    command: ["live", "--redis-url", "redis://redis:6379/0"]
    restart: unless-stopped

  meteovoid-api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
